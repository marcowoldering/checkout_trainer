name: checout_trainer
description: A new Flutter project.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  linear_timer: ^2.0.0
  google_fonts: ^6.1.0

  english_words: ^4.0.0
  provider: ^6.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/checkout_trainer_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/dartbord.jpg
    - assets/icon/checkout_trainer_logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
    - family: Chivo
      fonts:
        - asset: assets/fonts/Chivo/static/Chivo-Regular.ttf
        - asset: assets/fonts/Chivo/static/Chivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Chivo/static/Chivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Chivo/static/Chivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Chivo/static/Chivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Chivo/static/Chivo-Black.ttf
          weight: 900